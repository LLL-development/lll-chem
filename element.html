<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#222220">
<link rel="icon" href="shared/favicon.svg">
<link rel="stylesheet" href="shared/brand.css">
<title>Element · Chem Balancer</title>
<style>
  body { justify-content: flex-start; }
  .wrap { width:100%; max-width:560px; margin:0 auto;
    padding: max(20px, env(safe-area-inset-top)) 20px 48px; display:flex; flex-direction:column; gap:16px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .back { display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:600;
    color:var(--ink); text-decoration:none; }
  .back:hover { color:var(--accent); }

  .hero { display:flex; gap:16px; align-items:center;
    background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; }
  .symtile { flex:none; width:88px; height:88px; border-radius:14px; position:relative;
    background:var(--accent-tint); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .symtile::before { content:""; position:absolute; left:0; top:0; bottom:0; width:6px; border-radius:14px 0 0 14px; background:var(--cat,var(--border)); }
  .symtile .s { font-size:38px; font-weight:800; line-height:1; }
  .symtile .z { font-size:12px; color:var(--muted); margin-top:3px; }
  .hero .meta .nm { font-size:22px; font-weight:800; }
  .hero .meta .cat { font-size:13px; color:var(--muted); margin-top:2px; }
  .hero .meta .mass { font-size:13px; margin-top:6px; }
  .hero .meta .mass b { font-family:var(--mono); }

  .cat-alkali{--cat:#e8845a;} .cat-alkaline{--cat:#e0b13c;} .cat-transition{--cat:#6aa9d8;}
  .cat-post{--cat:#8aa1a8;} .cat-nonmetal{--cat:#63b57e;} .cat-halogen{--cat:#b57ec6;}

  .bohr { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:10px; }
  .bohr svg { width:100%; height:auto; display:block; }
  .shell { fill:none; stroke:var(--border); stroke-width:1; }
  .nucleus { fill:var(--accent); }
  .nucleus-t { fill:var(--on-accent,#fff); font-weight:700; }
  .elec { fill:var(--cat,#63b57e); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ring-g { transform-origin:150px 120px; }
  @media (prefers-reduced-motion: no-preference) {
    .ring-g.r0 { animation: spin 18s linear infinite; }
    .ring-g.r1 { animation: spin 26s linear infinite reverse; }
    .ring-g.r2 { animation: spin 34s linear infinite; }
    .ring-g.r3 { animation: spin 42s linear infinite reverse; }
  }

  .info { display:flex; flex-direction:column; gap:10px; }
  .row { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 15px; }
  .row .k { font-size:12px; color:var(--muted); }
  .row .v { font-size:15px; margin-top:3px; line-height:1.5; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:5px; }
  .chips code { font-family:var(--mono); font-size:13px; background:var(--bg); border:1px solid var(--border);
    border-radius:6px; padding:2px 8px; }
  .shellline { font-family:var(--mono); font-size:14px; }

  .facts { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .fact { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
  .fact .k { font-size:12px; color:var(--muted); }
  .fact .v { font-size:17px; font-weight:700; margin-top:2px; }
  .sectitle { font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin:6px 2px 0; }
  .locator { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; }
  .locator svg { width:100%; height:auto; display:block; }
  .pt-cell { fill:var(--accent-tint); stroke:var(--border); stroke-width:.5; }
  .pt-cell.here { fill:var(--cat,#63b57e); }
  .pt-here-t { fill:var(--on-accent,#fff); font-weight:700; }
  .dyk { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--cat,#e0843c); border-radius:12px; padding:14px 16px; }
  .dyk .k { font-size:13px; font-weight:700; margin-bottom:4px; }
  .dyk .v { font-size:14px; line-height:1.6; color:var(--muted); }
  .picker { }
  .picker h1 { font-size:16px; font-weight:700; margin:0 0 12px; text-align:center; }
  .pgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:8px; }
  .pgrid a { position:relative; overflow:hidden; text-decoration:none; color:var(--ink);
    background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 4px 7px; text-align:center; }
  .pgrid a::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--cat,var(--border)); }
  .pgrid a:hover { border-color:var(--accent); }
  .pgrid .sym { font-size:17px; font-weight:700; display:block; }
  .pgrid .num { font-size:10px; color:var(--muted); display:block; margin-top:1px; }
  .cat-alkali{--cat:#e8845a;} .cat-alkaline{--cat:#e0b13c;} .cat-transition{--cat:#6aa9d8;}
  .cat-post{--cat:#8aa1a8;} .cat-nonmetal{--cat:#63b57e;} .cat-halogen{--cat:#b57ec6;}
  .elnav { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .elnav a { position:relative; overflow:hidden; flex:1 1 44px; min-width:44px; max-width:60px; text-align:center;
    text-decoration:none; color:var(--ink); background:var(--surface); border:1px solid var(--border);
    border-radius:9px; padding:7px 6px 5px; }
  .elnav a::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--cat,var(--border)); }
  .elnav a.cur { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .elnav a:hover { border-color:var(--accent); }
  .elnav .s { font-size:15px; font-weight:700; display:block; }
  .elnav .z { font-size:9px; color:var(--muted); display:block; }
  .relchips { display:flex; flex-wrap:wrap; gap:6px; }
  .relchips a { text-decoration:none; font-family:var(--mono); font-size:13px; color:var(--ink);
    background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:3px 9px; }
  .relchips a:hover { border-color:var(--accent); }
  .chips a { text-decoration:none; color:inherit; }
  .chips a:hover code { border-color:var(--accent); }
  .notfound { text-align:center; padding:40px 0; color:var(--muted); }
</style>
<script>
  (function(){try{var t=localStorage.getItem("lll_theme");
  if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}
  document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        <span data-i18n="back">Back</span>
      </a>
      <div id="navRight" style="display:flex; gap:8px; align-items:center;"></div>
    </div>
    <div id="content"></div>
  </div>

  <script src="shared/theme.js"></script>
  <script src="shared/elements-data.js"></script>
  <script src="shared/i18n.js"></script>
  <script>
  var S = {
    "ja":{"moreElements":"ほかの元素","related":"よく一緒に出てくる元素","pickPrompt":"元素を選んでください","dataMissing":"データを読み込めません（shared/elements-data.js を確認）。","keyFacts":"基本データ","stateLabel":"常温での状態","periodLabel":"周期","groupLabel":"族","valenceLabel":"最外殻電子","locatorLabel":"周期表での位置","didYouKnow":"知っていましたか？","solid":"固体","liquid":"液体","gas":"気体",back:"戻る",atomicNo:"原子番号",atomicMass:"原子量",category:"分類",shellsLabel:"電子殻",useLabel:"主な用途",appearsIn:"登場する化合物",notFound:"元素が見つかりません。",
      alkali:"アルカリ金属",alkaline:"アルカリ土類金属",transition:"遷移金属",post:"卑金属",nonmetal:"非金属",halogen:"ハロゲン"},
    "en":{"moreElements":"Other elements","related":"Often appears with","pickPrompt":"Choose an element","dataMissing":"Couldn\u0027t load data (check shared/elements-data.js).","keyFacts":"Key facts","stateLabel":"State at room temp","periodLabel":"Period","groupLabel":"Group","valenceLabel":"Outer electrons","locatorLabel":"Place in the periodic table","didYouKnow":"Did you know?","solid":"Solid","liquid":"Liquid","gas":"Gas",back:"Back",atomicNo:"Atomic number",atomicMass:"Atomic mass",category:"Category",shellsLabel:"Electron shells",useLabel:"Used for",appearsIn:"Appears in",notFound:"Element not found.",
      alkali:"Alkali metal",alkaline:"Alkaline earth",transition:"Transition metal",post:"Post-transition metal",nonmetal:"Non-metal",halogen:"Halogen"},
    "zh-Hans":{"moreElements":"其他元素","related":"常一起出现的元素","pickPrompt":"选择一个元素","dataMissing":"无法加载数据（请检查 shared/elements-data.js）。","keyFacts":"基本数据","stateLabel":"常温状态","periodLabel":"周期","groupLabel":"族","valenceLabel":"最外层电子","locatorLabel":"在周期表中的位置","didYouKnow":"你知道吗？","solid":"固体","liquid":"液体","gas":"气体",back:"返回",atomicNo:"原子序数",atomicMass:"原子量",category:"分类",shellsLabel:"电子层",useLabel:"主要用途",appearsIn:"出现在",notFound:"未找到该元素。",
      alkali:"碱金属",alkaline:"碱土金属",transition:"过渡金属",post:"贫金属",nonmetal:"非金属",halogen:"卤素"},
    "zh-Hant":{"moreElements":"其他元素","related":"常一起出現的元素","pickPrompt":"選擇一個元素","dataMissing":"無法載入資料（請檢查 shared/elements-data.js）。","keyFacts":"基本數據","stateLabel":"常溫狀態","periodLabel":"週期","groupLabel":"族","valenceLabel":"最外層電子","locatorLabel":"在週期表中的位置","didYouKnow":"你知道嗎？","solid":"固體","liquid":"液體","gas":"氣體",back:"返回",atomicNo:"原子序數",atomicMass:"原子量",category:"分類",shellsLabel:"電子層",useLabel:"主要用途",appearsIn:"出現在",notFound:"未找到該元素。",
      alkali:"鹼金屬",alkaline:"鹼土金屬",transition:"過渡金屬",post:"貧金屬",nonmetal:"非金屬",halogen:"鹵素"},
    "ko":{"moreElements":"다른 원소","related":"자주 함께 나오는 원소","pickPrompt":"원소를 선택하세요","dataMissing":"데이터를 불러올 수 없습니다(shared/elements-data.js 확인).","keyFacts":"기본 정보","stateLabel":"상온 상태","periodLabel":"주기","groupLabel":"족","valenceLabel":"최외각 전자","locatorLabel":"주기율표에서의 위치","didYouKnow":"알고 있나요?","solid":"고체","liquid":"액체","gas":"기체",back:"뒤로",atomicNo:"원자 번호",atomicMass:"원자량",category:"분류",shellsLabel:"전자 껍질",useLabel:"주요 용도",appearsIn:"등장 화합물",notFound:"원소를 찾을 수 없습니다.",
      alkali:"알칼리 금속",alkaline:"알칼리 토금속",transition:"전이 금속",post:"전이후 금속",nonmetal:"비금속",halogen:"할로겐"},
    "ms":{"moreElements":"Unsur lain","related":"Kerap muncul bersama","pickPrompt":"Pilih satu unsur","dataMissing":"Tidak dapat memuatkan data (semak shared/elements-data.js).","keyFacts":"Fakta utama","stateLabel":"Keadaan pada suhu bilik","periodLabel":"Kala","groupLabel":"Kumpulan","valenceLabel":"Elektron luar","locatorLabel":"Kedudukan dalam jadual berkala","didYouKnow":"Tahukah anda?","solid":"Pepejal","liquid":"Cecair","gas":"Gas",back:"Kembali",atomicNo:"Nombor atom",atomicMass:"Jisim atom",category:"Kategori",shellsLabel:"Petala elektron",useLabel:"Kegunaan",appearsIn:"Muncul dalam",notFound:"Unsur tidak dijumpai.",
      alkali:"Logam alkali",alkaline:"Logam alkali bumi",transition:"Logam peralihan",post:"Logam pasca-peralihan",nonmetal:"Bukan logam",halogen:"Halogen"}
  };

  var navRight=document.getElementById("navRight"), content=document.getElementById("content");
  if (window.LLL_THEME && LLL_THEME.button) navRight.appendChild(LLL_THEME.button());
  var langHost=document.createElement("div"); navRight.appendChild(langHost);

  function param(name){ var m=new RegExp("[?&]"+name+"=([^&]+)").exec(location.search); return m?decodeURIComponent(m[1]):null; }
  var sym=param("el");
  var data=(window.ELEMENTS_DATA||{})[sym];

  LLL_I18N.init(S, { switcherHost: langHost, onChange: render });

  function bohr(el){
    var cx=150, cy=120, nr=20;
    var svg='<svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg">';
    var shells=el.shells, maxR=100, base=34, step=(shells.length>1)?(maxR-base)/(shells.length-1):0;
    shells.forEach(function(count,si){
      var r=base+step*si;
      svg+='<circle class="shell" cx="'+cx+'" cy="'+cy+'" r="'+r.toFixed(1)+'"/>';
      var g='<g class="ring-g r'+si+'">';
      for(var e=0;e<count;e++){
        var ang=(2*Math.PI*e/count) - Math.PI/2;
        var ex=cx+r*Math.cos(ang), ey=cy+r*Math.sin(ang);
        g+='<circle class="elec" cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="3.4"/>';
      }
      g+='</g>'; svg+=g;
    });
    svg+='<circle class="nucleus" cx="'+cx+'" cy="'+cy+'" r="'+nr+'"/>';
    svg+='<text class="nucleus-t" x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="16">'+sym+'</text>';
    svg+='</svg>';
    return svg;
  }


  /* Compact periodic-table locator: periods 1-4, correct silhouette, current cell highlighted. */

  /* Elements that co-occur with `sym` in the game's compounds (from precomputed "in" lists). */
  function relatedElements(symbol){
    var D=window.ELEMENTS_DATA, mine=D[symbol]["in"], set={}, out=[];
    Object.keys(D).forEach(function(k){
      if(k===symbol) return;
      var shares = D[k]["in"].some(function(f){ return mine.indexOf(f)>=0; });
      if(shares){ out.push(k); }
    });
    // sort by atomic number for a stable order
    out.sort(function(a,b){ return D[a].z-D[b].z; });
    return out;
  }

  /* which game compounds contain a given element symbol (for making compound chips linkable) */
  function elementsInFormula(f){
    var D=window.ELEMENTS_DATA, out=[];
    Object.keys(D).forEach(function(k){ if(D[k]["in"].indexOf(f)>=0) out.push(k); });
    return out;
  }

  function locator(el){
    var rows={1:[1,18], 2:[1,2,13,14,15,16,17,18], 3:[1,2,13,14,15,16,17,18], 4:[]};
    for(var g=1; g<=18; g++) rows[4].push(g);
    var cell=13, gap=1.5, x0=6, y0=6, W=6*2+18*(cell+gap);
    var svg='<svg viewBox="0 0 '+Math.round(W)+' '+Math.round(y0*2+4*(cell+gap))+'" xmlns="http://www.w3.org/2000/svg">';
    for(var per=1; per<=4; per++){
      rows[per].forEach(function(grp){
        var x=x0+(grp-1)*(cell+gap), y=y0+(per-1)*(cell+gap);
        var here=(per===el.period && grp===el.group);
        svg+='<rect class="pt-cell'+(here?" here":"")+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+cell+'" height="'+cell+'" rx="1.5"/>';
        if(here){
          svg+='<text class="pt-here-t" x="'+(x+cell/2).toFixed(1)+'" y="'+(y+cell/2+2.5).toFixed(1)+'" text-anchor="middle" font-size="7">'+sym+'</text>';
        }
      });
    }
    svg+='</svg>';
    return svg;
  }

  function renderPicker(){
    var d=window.ELEMENTS_DATA, lang=LLL_I18N.lang();
    var tiles=Object.keys(d).map(function(k){
      return '<a class="cat-'+d[k].c+'" href="?el='+encodeURIComponent(k)+'">'+
             '<span class="sym">'+k+'</span><span class="num">'+d[k].z+'</span></a>';
    }).join("");
    content.innerHTML='<div class="picker"><h1>'+LLL_I18N.t("pickPrompt")+'</h1><div class="pgrid">'+tiles+'</div></div>';
  }

  function render(){
    if(!window.ELEMENTS_DATA){ content.innerHTML='<p class="notfound">'+LLL_I18N.t("dataMissing")+'</p>'; return; }
    if(!data){ renderPicker(); return; }
    var lang=LLL_I18N.lang();
    var name=data.n[lang]||data.n.en;
    var use=data.use[lang]||data.use.en;
    var cat=LLL_I18N.t(data.c);
    var chips=data["in"].map(function(f){return '<code>'+f+'</code>';}).join("");
    content.innerHTML=
      '<div class="elnav">'+ Object.keys(window.ELEMENTS_DATA).map(function(k){
          return '<a class="cat-'+window.ELEMENTS_DATA[k].c+(k===sym?" cur":"")+'" href="?el='+encodeURIComponent(k)+'">'+
                 '<span class="s">'+k+'</span><span class="z">'+window.ELEMENTS_DATA[k].z+'</span></a>';
        }).join("") + '</div>'+
      '<div class="hero">'+
        '<div class="symtile cat-'+data.c+'"><span class="s">'+sym+'</span><span class="z">'+data.z+'</span></div>'+
        '<div class="meta"><div class="nm">'+name+'</div><div class="cat">'+cat+'</div>'+
        '<div class="mass">'+LLL_I18N.t("atomicMass")+': <b>'+data.m+'</b></div></div>'+
      '</div>'+
      '<div class="bohr cat-'+data.c+'">'+bohr(data)+'</div>'+

      '<div class="sectitle">'+LLL_I18N.t("keyFacts")+'</div>'+
      '<div class="facts">'+
        '<div class="fact"><div class="k">'+LLL_I18N.t("stateLabel")+'</div><div class="v">'+LLL_I18N.t(data.state)+'</div></div>'+
        '<div class="fact"><div class="k">'+LLL_I18N.t("valenceLabel")+'</div><div class="v">'+data.shells[data.shells.length-1]+'</div></div>'+
        '<div class="fact"><div class="k">'+LLL_I18N.t("periodLabel")+'</div><div class="v">'+data.period+'</div></div>'+
        '<div class="fact"><div class="k">'+LLL_I18N.t("groupLabel")+'</div><div class="v">'+data.group+'</div></div>'+
      '</div>'+

      '<div class="sectitle">'+LLL_I18N.t("locatorLabel")+'</div>'+
      '<div class="locator cat-'+data.c+'">'+locator(data)+'</div>'+

      '<div class="info">'+
        '<div class="row"><div class="k">'+LLL_I18N.t("shellsLabel")+'</div><div class="v shellline">'+data.shells.join(" · ")+'</div></div>'+
        '<div class="row"><div class="k">'+LLL_I18N.t("useLabel")+'</div><div class="v">'+use+'</div></div>'+
        '<div class="dyk"><div class="k">'+LLL_I18N.t("didYouKnow")+'</div><div class="v">'+(data.fact[lang]||data.fact.en)+'</div></div>'+
        '<div class="row"><div class="k">'+LLL_I18N.t("appearsIn")+'</div><div class="v"><div class="chips">'+chips+'</div></div></div>'+
        '<div class="row"><div class="k">'+LLL_I18N.t("related")+'</div><div class="v"><div class="relchips">'+
          relatedElements(sym).map(function(k){
            return '<a href="?el='+encodeURIComponent(k)+'">'+k+'</a>';
          }).join("")+
        '</div></div></div>'+
      '</div>';
  }
  render();
  </script>
</body>
</html>
